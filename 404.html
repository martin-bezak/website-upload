<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Martin Bezak</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7d1128">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
  <!-- Absolute paths, because this page can be shown at any address on the site -->
  <link rel="stylesheet" href="/styles.css">
  <script>
    /* MB Arcade moved from /bold/ to /MBArcade/ (27 Oct 2026), and the host is case-sensitive:
       send old links and any spelling of /mbarcade to the real address, keeping the rest of the path. */
    (function () {
      var p = location.pathname, m = p.match(/^\/(bold|mbarcade)(\/.*)?$/i);
      if (m && p.indexOf('/MBArcade') !== 0) location.replace('/MBArcade' + (m[2] || '/') + location.search + location.hash);
    })();
  </script>
  <script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body class="s-oxblood">
  <main class="notfound">
    <div class="wrap">
      <p class="big" aria-hidden="true">404</p>
      <p class="h3">404 · Off the map</p>
      <h1>This page doesn't exist.</h1>
      <p class="lead">The link may be old or mistyped. / <span lang="sk">Táto stránka neexistuje.</span></p>
      <div class="buttons">
        <a href="/index.html" class="btn btn-primary">Go to the main page</a>
        <a href="/sk/index.html" class="btn btn-secondary" lang="sk">Slovenská verzia</a>
      </div>
    </div>
  </main>
</body>
</html>
